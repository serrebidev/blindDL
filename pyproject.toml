[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "blindDL"
version = "0.14.4"
description = "Accessible cross-platform media downloader"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "serrebidev" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: GTK",
  "Environment :: MacOS X",
  "Environment :: Win32 (MS Windows)",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia",
]
dependencies = [
  "wxPython>=4.2; platform_system != 'Linux'",
  "yt-dlp[default]>=2025.1.1",
  # musicdl is vendored at its current upstream HEAD because its published
  # metadata pins a vulnerable cryptography release. Keep these requirements
  # aligned with requirements-musicdl.txt and musicdl/VENDORED.md.
  "click>=8.0,<9",
  "json-repair>=0.58.6,<1",
  "prettytable>=3.17,<4",
  "pycryptodomex>=3.23,<4",
  "orjson>=3.11.8,<4",
  "cryptography>=50,<51",
  "fake-useragent>=2.2,<3",
  "pathvalidate>=3.3.1,<4",
  "emoji>=2.15,<3",
  "bleach>=6.3,<7",
  "beautifulsoup4>=4.14.3,<5",
  "aigpy==2022.7.8.1",
  "av>=17,<18",
  "tabulate>=0.10,<1",
  "m3u8>=6,<7",
  "pywidevine>=1.9,<2",
  "tinytag>=2.2.1,<3",
  "lxml>=6.0.2,<7",
  "prompt-toolkit>=3.0.52,<4",
  "nodejs-wheel>=24.14,<25",
  "brotli>=1.0.9,<2",
  "filetype>=1.2,<2",
  "puremagic>=1.30,<2; python_version < '3.12'",
  "puremagic>=2.1.1,<3; python_version >= '3.12'",
  "websocket-client>=1.8,<2",
  # Side B is vendored in ./sideb -- its upstream repository was deleted in
  # August 2026, so there is nothing left to install from. These are the
  # dependencies its code imports; see THIRD_PARTY_NOTICES.md.
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "questionary>=2.0",
  "rich>=14.3.3,<15",
  "ytmusicapi>=1.11.5,<2",
  # Free audiobook sites. The git build carries the chapter and narrator
  # fields the Search tab shows; the 0.7 release on PyPI does not.
  "audiobooker @ git+https://github.com/LeMetadatarr/audiobooker",
  "requests>=2.32.5,<3",
  "defusedxml>=0.7.1",
  # Optional: the in-app torrent engine (Settings, Torrents). blindDL runs
  # without it and hands magnets to the user's own client instead, so the
  # marker keeps a fresh install from failing on a Python version libtorrent
  # has not published wheels for yet. Settings offers to install it on demand.
  "libtorrent>=2.0.11; python_version < '3.14'",
  "mutagen>=1.47,<2",
  "pycryptodome>=3.23,<4",
  "platformdirs>=4.9.4,<5",
  "tzdata>=2025.2",
  # Soulseek is disabled by default in Settings; complete installations still
  # include its asyncio protocol backend so enabling it works immediately.
  "aioslsk>=1.6.3,<2",
  "python-vlc>=3.0.21203",
  "chardet>=7,<7.4",
  "pycparser>=2.23,<3",
  # Adult providers are bundled so the disabled-by-default Settings checkbox
  # can enable them without requiring a second installation.
  "curl-cffi>=0.14,<1",
  "aebndl @ git+https://github.com/hyper440/aebn-vod-downloader@38438ec1660c56524bfe7007c4a8e1343994a589",
  "eaf_base_api @ git+https://github.com/EchterAlsFake/eaf_base_api",
  "unofficial-api-for-beeg @ git+https://github.com/EchterAlsFake/unofficial-api-for-beeg",
  "unofficial-api-for-eporner @ git+https://github.com/EchterAlsFake/unofficial-api-for-eporner",
  "unofficial-api-for-hqporner @ git+https://github.com/EchterAlsFake/unofficial-api-for-hqporner",
  "unofficial-api-for-missav @ git+https://github.com/EchterAlsFake/unofficial-api-for-missav",
  "porngo_api @ git+https://github.com/EchterAlsFake/unofficial-api-for-porngo",
  "unofficial-api-for-pornhub @ git+https://github.com/EchterAlsFake/unofficial-api-for-pornhub",
  "unofficial-api-for-porntrex @ git+https://github.com/EchterAlsFake/unofficial-api-for-porntrex",
  "unofficial-api-for-redtube @ git+https://github.com/EchterAlsFake/unofficial-api-for-redtube",
  "Sex_API @ git+https://github.com/EchterAlsFake/unofficial-api-for-sex.com",
  "unofficial-api-for-spankbang @ git+https://github.com/EchterAlsFake/unofficial-api-for-spankbang",
  "unofficial-api-for-thumbzilla @ git+https://github.com/EchterAlsFake/unofficial-api-for-thumbzilla",
  "unofficial-api-for-tube8 @ git+https://github.com/EchterAlsFake/unofficial-api-for-tube8",
  "unofficial-api-for-xfreehd @ git+https://github.com/EchterAlsFake/unofficial-api-for-xfreehd",
  "unofficial-api-for-xhamster @ git+https://github.com/EchterAlsFake/unofficial-api-for-xhamster",
  "unofficial-api-for-xnxx @ git+https://github.com/EchterAlsFake/unofficial-api-for-xnxx",
  "unofficial-api-for-xvideos @ git+https://github.com/EchterAlsFake/unofficial-api-for-xvideos",
  "unofficial-api-for-youporn @ git+https://github.com/EchterAlsFake/unofficial-api-for-youporn",
]

[project.urls]
Homepage = "https://github.com/serrebidev/blindDL"
Issues = "https://github.com/serrebidev/blindDL/issues"

[project.gui-scripts]
blinddl = "blinddl.__main__:main"

[tool.setuptools.packages.find]
include = ["blinddl*", "musicdl*", "sideb*"]

[tool.setuptools.package-data]
musicdl = [
  "LICENSE",
  "VENDORED.md",
  "modules/js/youtube/*.js",
  "modules/wvds/*.wvd",
]
sideb = ["VENDORED.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
