[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "blindDL"
version = "0.1.1"
description = "Accessible cross-platform media downloader"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "serrebidev" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: GTK",
  "Environment :: MacOS X",
  "Environment :: Win32 (MS Windows)",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia",
]
dependencies = [
  "wxPython>=4.2; platform_system != 'Linux'",
  "yt-dlp>=2025.1.1",
  "musicdl>=2.5.0",
  "sideb @ git+https://github.com/mosaddiqdev/sideb",
  "requests>=2.32",
  "mutagen>=1.47",
  "pycryptodome>=3.20",
  "platformdirs>=4.3",
  "chardet>=7,<7.4",
  "pycparser>=2.23,<3",
]

[project.urls]
Homepage = "https://github.com/serrebidev/blindDL"
Issues = "https://github.com/serrebidev/blindDL/issues"

[project.gui-scripts]
blinddl = "blinddl.__main__:main"

[tool.setuptools.packages.find]
include = ["blinddl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
