name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: License and secret audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Reject committed ARL credentials
        run: python scripts/check_no_arl.py
      - name: Scan for other secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
      - name: Verify Python syntax
        run: python -m compileall -q main.py blinddl musicdl sideb scripts tools tests
      - name: Verify SPDX headers
        run: |
          missing="$(find blinddl scripts tools tests -name '*.py' -type f -print0 | xargs -0 grep -L 'SPDX-License-Identifier: MIT' || true)"
          if [ -n "$missing" ]; then
            printf 'Missing MIT SPDX header:\n%s\n' "$missing" >&2
            exit 1
          fi
