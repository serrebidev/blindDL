name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: License and secret audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Reject committed ARL credentials
        run: python scripts/check_no_arl.py
      - name: Scan for other secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
      - name: Verify Python syntax
        run: python -m compileall -q main.py blinddl musicdl sideb scripts tools tests
      - name: Verify SPDX headers
        run: |
          missing="$(find blinddl scripts tools tests -name '*.py' -type f -print0 | xargs -0 grep -L 'SPDX-License-Identifier: MIT' || true)"
          if [ -n "$missing" ]; then
            printf 'Missing MIT SPDX header:\n%s\n' "$missing" >&2
            exit 1
          fi

  test:
    name: Tests (Linux)
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      # Same packages as the Linux release host (cloud-release.yml):
      # wx.media needs GStreamer's playbin3 or the GUI tests die with a
      # GLib trap, and xvfb provides the display they run against.
      - name: Install system packages
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git python3 python3-venv python3-dev python3-pip \
            python3-wxgtk4.0 python3-wxgtk-media4.0 xvfb xauth dbus \
            build-essential binutils dpkg-dev ffmpeg nodejs \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - uses: actions/checkout@v7
      - name: Create virtualenv with system wxPython
        run: |
          python3 -m venv .venv-ci
          SYSTEM_WX="$(python3 -c 'import pathlib, wx; print(pathlib.Path(wx.__file__).parent)')"
          VENV_SITE="$(.venv-ci/bin/python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          ln -s "$SYSTEM_WX" "$VENV_SITE/wx"
          .venv-ci/bin/python -m pip install --upgrade pip setuptools wheel
          .venv-ci/bin/python -m pip install pytest -r requirements.txt
          .venv-ci/bin/python -m pip install --upgrade --pre yt-dlp
      - name: Run tests
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          xvfb-run -a dbus-run-session -- .venv-ci/bin/python -m pytest -q
