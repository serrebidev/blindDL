name: Cloud release

# Every public release runs here. Every platform builds on GitHub runners and
# the release is published on Forgejo:
#   windows - build.bat with the maintained CPython 3.14 libtorrent wheel from
#             the libtorrent-wheels pre-release (the weekly wheelhouse)
#   linux   - tools/build_linux_release.sh in a debian:trixie container
#   publish - tag, Forgejo draft with both platforms and the notes, release.yml
#             for the Apple Silicon DMG, then scripts/publish_release.py
#
# First commit "chore: release X.Y.Z" (bump blinddl/__init__.py) to main, then:
#   gh workflow run cloud-release.yml -f dry_run=true
#   gh workflow run cloud-release.yml -f dry_run=false -f notes="$(cat notes.md)"

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build Windows and Linux as workflow artifacts; tag and publish nothing
        required: false
        default: true
        type: boolean
      notes:
        description: Release notes (house prose, Markdown). Required for a real release.
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - name: Require main
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Cloud releases run from main only (got ${{ github.ref }})."
          exit 1
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Read version
        id: plan
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          NOTES: ${{ inputs.notes }}
        run: |
          v="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' blinddl/__init__.py)"
          [ -n "$v" ] || { echo "::error::No __version__ in blinddl/__init__.py"; exit 1; }
          if [ "$DRY_RUN" != "true" ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
              echo "::error::v$v is already tagged. Commit 'chore: release X.Y.Z' with the new version first."; exit 1
            fi
            [ -n "$NOTES" ] || { echo "::error::A real release needs the notes input."; exit 1; }
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "blindDL $v at $(git rev-parse HEAD)"

  windows:
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies, Inno Setup and the libtorrent wheel
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "pyinstaller>=6.19" pytest -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "pip install failed" }
          python -m pip install --upgrade --pre yt-dlp
          choco install innosetup --no-progress -y
          $wheels = Join-Path $env:RUNNER_TEMP "wheels"
          gh release download libtorrent-wheels --repo $env:GITHUB_REPOSITORY --pattern '*win_amd64.whl' --dir $wheels
          if ($LASTEXITCODE -ne 0) { throw "wheel download failed" }
          "BLINDDL_LIBTORRENT_WHEELHOUSE=$wheels" >> $env:GITHUB_ENV
      - name: Test and build (build.bat)
        shell: cmd
        run: call build.bat
      - uses: actions/upload-artifact@v7
        with:
          name: blindDL-windows-x64
          path: release/*
          if-no-files-found: error

  linux:
    needs: plan
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 90
    steps:
      # wx.media needs GStreamer's playbin3 (plugins-base) or the GUI tests
      # die with a GLib trap; the release host has it installed.
      - name: Install the Linux release host's packages
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git python3 python3-venv python3-dev python3-pip \
            python3-wxgtk4.0 python3-wxgtk-media4.0 xvfb xauth build-essential binutils dpkg-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Test and build (tools/build_linux_release.sh)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sh tools/build_linux_release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: blindDL-linux-x64
          path: release/*
          if-no-files-found: error

  publish:
    if: ${{ !inputs.dry_run }}
    needs: [plan, windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
      V: ${{ needs.plan.outputs.version }}
      SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      # The tag goes first: pushing a tag auto-publishes a matching Forgejo draft,
      # so a draft made before it would go out with only some platforms.
      - name: Tag on Forgejo and GitHub
        run: |
          set -euo pipefail
          git tag "v$V" "$SHA"
          auth="$(printf 'x-access-token:%s' "$FORGEJO_TOKEN" | base64 -w0)"
          git -c "http.https://git.serrebiradio.com/.extraheader=Authorization: Basic $auth" \
            push https://git.serrebiradio.com/serrebi/blindDL.git "v$V"
          git push origin "v$V"
      - name: Create the Forgejo draft with Windows and Linux
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          python scripts/publish_release.py "v$V" --create --notes-file "$RUNNER_TEMP/notes.md" --assets "release/*"
      - name: Build macOS (release.yml) and wait
        run: |
          set -euo pipefail
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f release_tag="v$V"
          id=""
          for _ in $(seq 1 24); do
            id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --event workflow_dispatch --limit 20 \
              --json databaseId,createdAt --jq "[.[] | select(.createdAt >= \"$started\")] | sort_by(.createdAt) | last | .databaseId // empty")"
            [ -n "$id" ] && break
            sleep 5
          done
          [ -n "$id" ] || { echo "::error::Could not find the release.yml run for v$V"; exit 1; }
          gh run watch "$id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 60
      - name: Publish on Forgejo
        run: python scripts/publish_release.py "v$V" --verify-source-version
