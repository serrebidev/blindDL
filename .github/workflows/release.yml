name: Build release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    name: Release preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/check_no_arl.py
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1

  windows:
    name: Windows x64
    needs: audit
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install build tools
        shell: bash
        run: |
          # The Chocolatey feed intermittently answers 504 for one package or
          # another, and choco still exits 0 with that package missing. The
          # build only notices three steps later, when the spec refuses to
          # make an incomplete release, so every tool it needs is proven here.
          export PATH="$PATH:/c/ProgramData/chocolatey/bin"
          have_tools() {
            python - <<'PY'
          import os, shutil, sys
          from pathlib import Path

          absent = [tool for tool in ("ffmpeg", "ffprobe") if not shutil.which(tool)]
          program_files = os.environ.get("ProgramFiles", "")
          program_files_x86 = os.environ.get("ProgramFiles(x86)", "")
          if not Path(program_files, "VideoLAN", "VLC", "libvlc.dll").is_file():
              absent.append("vlc")
          if not (
              shutil.which("ISCC.exe")
              or Path(program_files_x86, "Inno Setup 6", "ISCC.exe").is_file()
              or Path(program_files, "Inno Setup 6", "ISCC.exe").is_file()
          ):
              absent.append("innosetup")
          print("missing build tools:", ", ".join(absent) if absent else "none")
          sys.exit(1 if absent else 0)
          PY
          }
          for attempt in 1 2 3 4 5; do
            choco install ffmpeg innosetup vlc --no-progress -y || true
            if have_tools; then exit 0; fi
            echo "Build tools incomplete on attempt $attempt; retrying."
            sleep 60
          done
          echo "The Chocolatey feed did not serve every build tool."
          exit 1
      - name: Install Python dependencies
        shell: bash
        run: |
          # Several requirements are git URLs, and hosted runners sometimes
          # fail one clone with a TLS error. Retry so a single bad fetch
          # cannot fail the whole release.
          install() {
            python -m pip install --upgrade pip setuptools wheel &&
            python -m pip install "pyinstaller>=6.19" pytest -r requirements.txt &&
            python -m pip install --upgrade --pre yt-dlp
          }
          for attempt in 1 2 3; do
            if install; then exit 0; fi
            echo "Dependency install failed on attempt $attempt; retrying."
            sleep 20
          done
          exit 1
      - name: Run tests
        run: python -m pytest -q
      - name: Build packages
        run: python tools/build_release.py
      - uses: actions/upload-artifact@v7
        with:
          name: blindDL-windows-x64
          path: release/*
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    needs: audit
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install native tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          if brew tap | grep -qx 'aws/tap'; then
            brew untap aws/tap
          fi
          brew install deno ffmpeg
          # As on Windows, the build refuses to package without libVLC, so a
          # flaky cask download is caught here rather than three steps later.
          for attempt in 1 2 3; do
            brew install --cask vlc || true
            if [ -f /Applications/VLC.app/Contents/MacOS/lib/libvlc.dylib ]; then
              break
            fi
            echo "VLC is missing after attempt $attempt; retrying."
            sleep 30
          done
          test -f /Applications/VLC.app/Contents/MacOS/lib/libvlc.dylib
      - name: Install Python dependencies
        run: |
          install() {
            python -m pip install --upgrade pip setuptools wheel &&
            python -m pip install "pyinstaller>=6.19" pytest -r requirements.txt &&
            python -m pip install --upgrade --pre yt-dlp
          }
          for attempt in 1 2 3; do
            if install; then exit 0; fi
            echo "Dependency install failed on attempt $attempt; retrying."
            sleep 20
          done
          exit 1
      - name: Run tests
        run: python -m pytest -q
      - name: Build packages
        run: python tools/build_release.py
      - uses: actions/upload-artifact@v7
        with:
          name: blindDL-macos-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  linux:
    name: Linux and Debian ${{ matrix.arch }}
    needs: audit
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      BLINDDL_BUNDLE_FFMPEG: "0"
    steps:
      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl git unzip \
            python3 python3-dev python3-pip python3-venv python3-wxgtk4.0 \
            python3-wxgtk-media4.0 \
            binutils patchelf dpkg-dev ffmpeg libvlc5 vlc-plugin-base \
            libgtk-3-0t64 libnotify4 xvfb xauth
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install Python dependencies
        run: |
          python3 -m venv --system-site-packages .venv
          install() {
            .venv/bin/python -m pip install --upgrade pip setuptools wheel &&
            .venv/bin/python -m pip install "pyinstaller>=6.19" pytest -r requirements.txt &&
            .venv/bin/python -m pip install --upgrade --pre yt-dlp
          }
          for attempt in 1 2 3; do
            if install; then exit 0; fi
            echo "Dependency install failed on attempt $attempt; retrying."
            sleep 20
          done
          exit 1
      - name: Run tests
        run: xvfb-run -a .venv/bin/python -m pytest -q
      - name: Build packages
        run: .venv/bin/python tools/build_release.py
      - uses: actions/upload-artifact@v7
        with:
          name: blindDL-linux-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --generate-notes \
              --title "blindDL $GITHUB_REF_NAME"
          fi
