name: Build macOS release

# Windows x64 releases are built locally with build.bat. Linux x64 releases
# are built over SSH on root@serrebiradio.com with
# tools/build_linux_release.sh. Hosted release runners intentionally own only
# the two macOS architectures below.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    name: Release preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/check_no_arl.py
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1

  macos:
    name: macOS ${{ matrix.arch }}
    needs: audit
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          install() {
            python -m pip install --upgrade pip setuptools wheel &&
            python -m pip install "pyinstaller>=6.19" pytest -r requirements.txt &&
            python -m pip install --upgrade --pre yt-dlp
          }
          for attempt in 1 2 3; do
            if install; then exit 0; fi
            echo "Dependency install failed on attempt $attempt; retrying."
            sleep 20
          done
          exit 1
      - name: Run tests
        run: python -m pytest -q
      - name: Build packages
        run: python tools/build_release.py
      - uses: actions/upload-artifact@v7
        with:
          name: blindDL-macos-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  publish:
    name: Add macOS assets to release
    if: startsWith(github.ref, 'refs/tags/')
    needs: macos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Upload macOS packages to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
