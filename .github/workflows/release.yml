name: Build macOS release

# Windows x64 releases are built locally with build.bat. Linux x64 releases
# are built over SSH on root@serrebiradio.com with
# tools/build_linux_release.sh. This workflow is the secondary macOS leg: it
# builds the Apple Silicon DMG on a hosted runner and attaches it to the
# Forgejo release, where scripts/publish_release.py publishes once every
# platform has landed. It needs a FORGEJO_TOKEN secret with release scope.
# While the GitHub account is unreachable there is no macOS leg and releases
# go out with --skip-macos; nothing here blocks them.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Release preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/check_no_arl.py
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1

  macos:
    name: macOS ${{ matrix.arch }}
    needs: audit
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon only; Intel Macs are no longer built.
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          install() {
            python -m pip install --upgrade pip setuptools wheel &&
            python -m pip install "pyinstaller>=6.19" pytest -r requirements.txt &&
            python -m pip install --upgrade --pre yt-dlp
          }
          for attempt in 1 2 3; do
            if install; then exit 0; fi
            echo "Dependency install failed on attempt $attempt; retrying."
            sleep 20
          done
          exit 1
      - name: Run tests
        run: python -m pytest -q
      - name: Build packages
        run: python tools/build_release.py
      - uses: actions/upload-artifact@v7
        with:
          name: blindDL-macos-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  upload:
    name: Attach macOS packages to the Forgejo release
    if: startsWith(github.ref, 'refs/tags/')
    needs: macos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Only the macOS packages: a dispatched run's gitleaks artifact brought a
      # release/work directory that made the upload below fail (v0.24.54).
      - uses: actions/download-artifact@v8
        with:
          pattern: blindDL-macos-*
          path: release
          merge-multiple: true
      - name: Upload macOS packages to the Forgejo draft
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          FORGEJO_HOST: git.serrebiradio.com
          FORGEJO_REPO: serrebi/blindDL
        run: |
          set -euo pipefail
          api="https://$FORGEJO_HOST/api/v1/repos/$FORGEJO_REPO"
          [ -n "$FORGEJO_TOKEN" ] || { echo "::error::FORGEJO_TOKEN secret is not set."; exit 1; }
          # The tag is pushed before the draft is created (a tag push
          # auto-publishes a matching draft), so wait for the draft here.
          for attempt in $(seq 1 30); do
            release="$(curl -s -H "Authorization: token $FORGEJO_TOKEN" \
              "$api/releases/tags/$GITHUB_REF_NAME")"
            id="$(echo "$release" | jq -r .id)"
            if [ -n "$id" ] && [ "$id" != "null" ]; then
              break
            fi
            echo "No Forgejo draft for $GITHUB_REF_NAME yet; waiting (attempt $attempt/30)."
            sleep 60
          done
          [ -n "$id" ] && [ "$id" != "null" ] || {
            echo "::error::No Forgejo draft for $GITHUB_REF_NAME after 30 minutes."
            exit 1
          }
          for file in release/*; do
            name="$(basename "$file")"
            if echo "$release" | jq --arg name "$name" -e \
              '[.assets[].name] | index($name) != null' >/dev/null; then
              echo "$name is already attached to $GITHUB_REF_NAME."
              continue
            fi
            echo "Uploading $name..."
            curl -sS -H "Authorization: token $FORGEJO_TOKEN" \
              -F "attachment=@$file" \
              "$api/releases/$id/assets?name=$name" >/dev/null
          done
          echo "macOS packages are on the Forgejo draft. The release host publishes with scripts/publish_release.py once Linux lands."
