name: Build release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    name: Release preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/check_no_arl.py
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    name: Windows x64
    needs: audit
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install build tools
        run: choco install ffmpeg innosetup --no-progress -y
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "pyinstaller>=6.19" -r requirements.txt
      - name: Build packages
        run: python tools/build_release.py
      - uses: actions/upload-artifact@v7
        with:
          name: blindDL-windows-x64
          path: release/*
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    needs: audit
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install native tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          if brew tap | grep -qx 'aws/tap'; then
            brew untap aws/tap
          fi
          brew install deno ffmpeg
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "pyinstaller>=6.19" -r requirements.txt
      - name: Build packages
        run: python tools/build_release.py
      - uses: actions/upload-artifact@v7
        with:
          name: blindDL-macos-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  linux:
    name: Linux and Debian ${{ matrix.arch }}
    needs: audit
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      BLINDDL_BUNDLE_FFMPEG: "0"
    steps:
      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl git unzip \
            python3 python3-dev python3-pip python3-venv python3-wxgtk4.0 \
            binutils patchelf dpkg-dev ffmpeg \
            libgtk-3-0t64 libnotify4
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install Python dependencies
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip setuptools wheel
          .venv/bin/python -m pip install "pyinstaller>=6.19" -r requirements.txt
      - name: Build packages
        run: .venv/bin/python tools/build_release.py
      - uses: actions/upload-artifact@v7
        with:
          name: blindDL-linux-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --generate-notes \
              --title "blindDL $GITHUB_REF_NAME"
          fi
