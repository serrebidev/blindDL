# Temporary: reproduces the wxGTK crash on a Linux runner without waiting for
# a full release build. Delete once the virtual list fix has landed.
name: Quick test

on:
  workflow_dispatch:
  push:
    branches: ["fix/**"]

permissions:
  contents: read

jobs:
  linux:
    name: pytest on Linux
    runs-on: ubuntu-24.04
    steps:
      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl git \
            python3 python3-dev python3-pip python3-venv python3-wxgtk4.0 \
            python3-wxgtk-media4.0 ffmpeg libvlc5 vlc-plugin-base \
            libgtk-3-0t64 libnotify4 xvfb xauth
      - uses: actions/checkout@v7
      - name: Install Python dependencies
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip setuptools wheel
          .venv/bin/python -m pip install pytest -r requirements.txt
      - name: Run tests
        run: xvfb-run -a .venv/bin/python -m pytest -q tests/test_gui_interactions.py
